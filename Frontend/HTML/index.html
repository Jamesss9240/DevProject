<!DOCTYPE html>
<html>
    <style>
        #metricsBoxes {
            justify-content: center !important;
            align-items: center !important;
            width: 100%;
        }
        .metric-circle-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 12px;
        }
        .metric-svg {
            display: block;
            margin: 0 auto;
        }
        .metric-label {
            font-size: 0.9rem;
            text-align: center;
            margin-top: 4px;
        }
    </style>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Code Improver</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</head>

<body>

    <div id="nav">

        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <div class="navList">
                    <p id="themeSelectText">Theme Select</p>
                    <button id="light-theme" class="btn btn-outline-secondary themeSelectBTN">Light</button>
                    <button id="dark-theme" class="btn btn-outline-secondary themeSelectBTN">Dark</button>
                </div>
                <a class="navbar-brand" id="titleText" href="#">Code Improver</a>
            </div>
        </nav>

    </div>

    <div class="container mt-5">
        <div class="mb-3">
            <label for="codeInput" class="form-label">Enter your code:</label>
            <textarea class="form-control" id="codeInput" rows="10" onkeydown="if(event.keyCode==9){this.value+='    ';return false;}"></textarea>
        </div>

        <button type="button" class="btn btn-primary" id="submitButton">Submit</button>
        <div class="mb-3">
            <label for="fileInput" class="form-label">Or upload your code file:</label>
            <input class="form-control" type="file" id="fileInput" />
        </div>

        <div class="mt-3">
            <label for="outputArea" class="form-label">Processed Output:</label>
            <textarea class="form-control" id="outputArea" rows="10" readonly></textarea>
        </div>

        
        <div id="metricsArea" class="row mt-3" style="display:none;">
            <div class="col-12">
                <label class="form-label">Predicted Quality Metrics:</label>
            </div>
            <div id="metricsBoxes" class="d-flex flex-wrap gap-2"></div>
        </div>

    </div>
    <script src="JS/uploadFile.js"></script>
    <script src="JS/ThemeSwitcher.js"></script>
    <script>
        $(document).ready(function () {
            async function processCode(codeText) {
                try {
                    const response = await fetch('http://127.0.0.1:5000/debug_code', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ code: codeText })
                    });
                    const data = await response.json();

                    //check for returned fixed code
                    if (data.success) {
                        return {
                            fixed: data.fixed,
                            metrics: data.quality_metrics || null
                        };
                    } else {
                        return { fixed: data.error || 'error', metrics: null };
                    }
                } catch (error) {
                    return { fixed: 'connection error :(', metrics: null };
                }
            }

            function getMetricColor(percent) {
                //colour caluclation formetrics
                if (percent <= 50) {
                    const ratio = percent / 50;                   
                    const r = Math.round(231 + (241 - 231) * ratio);
                    const g = Math.round(76 + (196 - 76) * ratio);
                    const b = Math.round(60 + (15 - 60) * ratio);
                    return `rgb(${r},${g},${b})`;
                } else {                   
                    const ratio = (percent - 50) / 50;
                    const r = Math.round(241 + (39 - 241) * ratio);
                    const g = Math.round(196 + (174 - 196) * ratio);
                    const b = Math.round(15 + (96 - 15) * ratio);
                    return `rgb(${r},${g},${b})`;
                }
            }

            function displayMetrics(metrics) {
                const metricsArea = document.getElementById('metricsArea');
                const metricsBoxes = document.getElementById('metricsBoxes');
                metricsBoxes.innerHTML = '';
                if (metrics && Object.keys(metrics).length > 0) {
                    metricsArea.style.display = '';
                    for (const [key, value] of Object.entries(metrics)) {
                        const percent = typeof value === 'number' ? Math.max(0, Math.min(100, Math.round(value))) : 0;
                        const radius = 28;
                        const stroke = 5;
                        const normalizedRadius = radius - stroke / 2;
                        const circumference = 2 * Math.PI * normalizedRadius;
                        const offset = circumference * (1 - percent / 100);
                        const color = getMetricColor(percent);

                       
                        const container = document.createElement('div');
                        container.className = 'metric-circle-container';
                        //setup for animated metric circles
                        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                        svg.setAttribute("height", radius * 2);
                        svg.setAttribute("width", radius * 2);
                        svg.classList.add("metric-svg");

                   
                        const bgCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                        bgCircle.setAttribute("stroke", "#e0e0e0");
                        bgCircle.setAttribute("fill", "transparent");
                        bgCircle.setAttribute("stroke-width", stroke);
                        bgCircle.setAttribute("r", normalizedRadius);
                        bgCircle.setAttribute("cx", radius);
                        bgCircle.setAttribute("cy", radius);

                        const fgCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                        fgCircle.setAttribute("stroke", color);
                        fgCircle.setAttribute("fill", "transparent");
                        fgCircle.setAttribute("stroke-width", stroke);
                        fgCircle.setAttribute("r", normalizedRadius);
                        fgCircle.setAttribute("cx", radius);
                        fgCircle.setAttribute("cy", radius);
                        fgCircle.setAttribute("stroke-dasharray", circumference);
                        fgCircle.setAttribute("stroke-dashoffset", circumference);
                        fgCircle.setAttribute("transform", `rotate(-90 ${radius} ${radius})`);
                        fgCircle.style.transition = "stroke-dashoffset 2s cubic-bezier(.4,2,.6,1)";

                       
                        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        text.setAttribute("x", radius);
                        text.setAttribute("y", radius + 6);
                        text.setAttribute("text-anchor", "middle");
                        text.setAttribute("font-size", "1.1rem");
                        text.setAttribute("fill", "#222");
                        text.setAttribute("font-weight", "bold");
                        text.textContent = percent;

                        svg.appendChild(bgCircle);
                        svg.appendChild(fgCircle);
                        svg.appendChild(text);

                        container.appendChild(svg);

                        //gives metrics their names
                        const label = document.createElement('div');
                        label.className = 'metric-label';
                        label.innerText = key.charAt(0).toUpperCase() + key.slice(1);
                        container.appendChild(label);

                        metricsBoxes.appendChild(container);

                        //animation for circles
                        setTimeout(() => {
                            fgCircle.setAttribute("stroke-dashoffset", offset);
                        }, 150);
                    }
                } else {
                    metricsArea.style.display = 'none';
                }
            }

            document.getElementById('submitButton').onclick = async () => {
                const code = document.getElementById('codeInput').value;
                document.getElementById('outputArea').value = 'Fixing input!';  
                displayMetrics(null);
                const result = await processCode(code);
                document.getElementById('outputArea').value = result.fixed;
                displayMetrics(result.metrics);
            };

            $("#fileInput").change(function (e) {
                var file = e.target.files[0];
                if (!file) return;

                var reader = new FileReader();
                reader.onload = function (evt) {
                    var code = evt.target.result;
                    $("#codeInput").val(code); 
                };
                reader.readAsText(file);
            });
        });
    </script>
</body>

</html>
