<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Code Improver</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</head>

<body>
  <!-- nav included due to importing via js causing bugs with the theme switcher -->
<div id="nav">
  
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <div class="navList">
                <p id="themeSelectText">Theme Select</p>
                <button id="light-theme" class="btn btn-outline-secondary themeSelectBTN">Light</button>
                <button id="dark-theme" class="btn btn-outline-secondary themeSelectBTN">Dark</button>
            </div>
            <a class="navbar-brand" id="titleText" href="#">Code Improver</a>
        </div>
    </nav>

</div>

<div class="container mt-5">
  <div class="mb-3">
    <label for="codeInput" class="form-label">Enter your code:</label>
    <textarea class="form-control" id="codeInput" rows="10"></textarea>
  </div>
  
  <button type="button" class="btn btn-primary" id="submitButton">Submit</button>
  <div class="mb-3"></div>
    <label for="fileInput" class="form-label">Or upload your code file:</label>
    <input class="form-control" type="file" id="fileInput" />
  </div>
  <script src="JS/uploadFile.js"></script>
  <script src="JS/ThemeSwitcher.js"></script>
</div>
</body>
